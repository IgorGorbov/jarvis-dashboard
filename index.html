<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg:#0d1116; --panel:#141a21; --line:#232c37;
    --text:#dbe3ec; --dim:#8794a6; --faint:#5d6a7c;
    --accent:#8aa8f5; --ok:#54c07d; --warn:#e0aa2e; --bad:#f2716c;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  a { color:var(--accent); }

  .top {
    display:flex; align-items:center; gap:.75rem; padding:.55rem .9rem;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  .brand { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .pill {
    display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line);
    border-radius:999px; padding:.12rem .6rem; font-size:11px; color:var(--dim);
  }
  .pill b { color:var(--text); font-weight:500; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; background:var(--faint); }
  .dot.on { background:var(--accent); }
  .spacer { flex:1; }
  button {
    font:inherit; color:var(--text); background:#1b232d;
    border:1px solid var(--line); border-radius:5px; padding:.22rem .7rem; cursor:pointer;
  }
  button.primary { background:#21365e; border-color:#2e4a7d; color:#cfdcfb; }
  button:disabled { color:var(--faint); background:transparent; cursor:default; }

  .body { flex:1; display:grid; grid-template-columns:auto 1fr auto; min-height:0; }
  .rail, .side { background:var(--panel); overflow-y:auto; }
  /* Колонки закреплены явно: без этого скрытая панель освобождает дорожку, и
     центр переезжает в `auto`-колонку, сжимаясь по содержимому вместо 1fr. */
  .rail { grid-column:1; width:210px; border-right:1px solid var(--line); }
  .main { grid-column:2; }
  .side { grid-column:3; width:300px; border-left:1px solid var(--line); padding:.6rem .7rem; }
  .rail.off, .side.off { display:none; }
  .toggle { color:var(--dim); padding:.22rem .55rem; }
  .toggle.off { color:var(--faint); background:transparent; }
  .label {
    font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faint); padding:.6rem .8rem .3rem;
  }
  .task { padding:.3rem .8rem; }
  .task-head { display:flex; justify-content:space-between; }
  .task-head span:last-child { color:var(--faint); }
  .runs { display:flex; flex-wrap:wrap; gap:3px; margin:.2rem 0 .1rem; }
  .runs button {
    width:20px; height:8px; padding:0; border-radius:2px; display:block;
    cursor:pointer; border:1px solid transparent;
  }
  .runs button.sel { border-color:var(--text); }
  .runs button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .pr { font-size:11px; cursor:copy; }
  .filter {
    width:calc(100% - 1.6rem); margin:0 .8rem .4rem; font:inherit; font-size:11px;
    background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:.2rem .35rem;
  }
  .task-head .name {
    background:transparent; border:none; padding:0; color:var(--text);
    font:inherit; cursor:pointer; text-align:left;
  }
  .task-head .name:hover { color:var(--accent); }
  .rows { display:flex; flex-direction:column; gap:1px; margin:.2rem 0 .1rem; }
  .run { display:flex; align-items:center; gap:.3rem; }
  .run.sel { background:#1a2436; }
  .run .pick {
    flex:1; min-width:0; display:flex; align-items:center; gap:.35rem;
    background:transparent; border:none; padding:.1rem 0; font:inherit;
    font-size:10px; cursor:pointer; text-align:left;
  }
  .run .mono { color:var(--text); white-space:nowrap; }
  .run .dim { color:var(--faint); }
  .run .when { white-space:nowrap; }
  .run .kind { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .run .dot { flex:none; }
  .run .pr { flex:none; }
  .prs .pr:not(:first-child) { color:var(--warn); }
  .runs .more {
    height:8px; padding:0 3px; font-size:9px; line-height:8px; color:var(--faint);
    background:transparent; border-color:var(--line);
  }

  .main { display:flex; flex-direction:column; min-width:0; }
  .strip {
    display:flex; align-items:center; gap:.4rem; flex-wrap:wrap;
    padding:.6rem .9rem; border-bottom:1px solid var(--line);
  }
  .step {
    border:1px solid var(--line); border-radius:5px; padding:.2rem .55rem;
    color:var(--faint); font-size:11px; white-space:nowrap;
  }
  .step.done { color:var(--ok); border-color:#24503a; }
  .step.now { color:#cfdcfb; border-color:#35538c; background:#1a2740; }
  .step.stop { color:var(--bad); border-color:#5c2a29; }
  /* Шаг петли уже работал, но в петле это не «пройдено» — только «был». */
  .step.ran { color:var(--dim); }
  .step.hold { color:var(--warn); border-color:#5c4a1a; }
  .arrow { color:var(--faint); font-size:11px; }
  .loop {
    display:inline-flex; align-items:center; gap:.35rem; border:1px solid #35538c;
    border-radius:6px; padding:.15rem .4rem; background:#141d2e;
  }
  .quiet { margin-left:auto; color:var(--faint); font-size:11px; }
  .quiet.stale { color:var(--warn); }
  .bar-row {
    display:flex; align-items:center; gap:.6rem;
    padding:.4rem .9rem; border-bottom:1px solid var(--line);
  }
  .bar-note { font-size:11px; color:var(--faint); white-space:nowrap; }
  .bar { flex:1; height:4px; background:#1e2732; border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; }

  .asked {
    border-bottom:1px solid var(--line); background:#1a1710;
    padding:.6rem .9rem; font-size:11px;
  }
  .asked h3 { margin:0 0 .35rem; font-size:11px; font-weight:500; color:var(--warn); }
  .asked ol { margin:.2rem 0 .5rem; padding-left:1.1rem; color:var(--text); }
  .asked li { margin:.2rem 0; }
  .asked textarea {
    width:100%; height:4rem; font:inherit; resize:vertical;
    background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:.3rem .4rem;
  }
  .asked .foot { display:flex; gap:.5rem; align-items:center; margin-top:.4rem; }
  .asked .hint { color:var(--faint); }

  .tabs { display:flex; gap:.3rem; padding:.35rem .9rem; border-bottom:1px solid var(--line); }
  .tab {
    background:transparent; border:1px solid transparent; color:var(--faint);
    padding:.1rem .5rem; font-size:11px;
  }
  .tab.on { color:var(--text); border-color:var(--line); background:#1b232d; }
  .tab:disabled { color:#3a4350; }

  .diff {
    flex:1; overflow:auto; margin:0; padding:.4rem 0;
    font:inherit; font-size:11px; line-height:1.5;
  }
  .diff div { padding:0 .9rem; white-space:pre; }
  .diff .add { color:var(--ok); }
  .diff .del { color:var(--bad); }
  .diff .file { color:var(--accent); background:#161d26; margin-top:.4rem; }
  .diff .hunk { color:var(--faint); }

  .feed { flex:1; overflow-y:auto; padding:.4rem 0; }
  .row { display:grid; grid-template-columns:66px 96px 1fr; gap:.5rem; padding:.09rem .9rem; }
  .row:hover { background:#161d26; }
  .at { color:var(--faint); font-variant-numeric:tabular-nums; }
  .who { color:var(--accent); }
  .row.ok .who, .row.ok .what { color:var(--ok); }
  .row.stop .who, .row.stop .what { color:var(--bad); }
  .row.hold .who, .row.hold .what { color:var(--warn); }
  .row.ms .who, .row.ms .what { color:var(--dim); }
  .what { white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty { color:var(--faint); padding:1rem .9rem; }

  /* Пути и имена файлов — единый токен без пробелов: без принудительного
     переноса карточка растягивается и панель уезжает в горизонтальный скролл. */
  .card, .asked { overflow-wrap:anywhere; }
  .card { border:1px solid var(--line); border-radius:6px; padding:.5rem .6rem; margin-bottom:.55rem; }
  .card h4 { margin:0 0 .3rem; font-size:11px; font-weight:500; color:var(--dim); }
  .card p { margin:.15rem 0; font-size:11px; }
  .card ul { margin:.2rem 0; padding-left:1rem; font-size:11px; }
  .files { display:flex; flex-wrap:wrap; gap:.3rem; }
  .files a { font-size:10px; border:1px solid var(--line); border-radius:4px; padding:.05rem .35rem; text-decoration:none; }

  dialog {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:8px; font:inherit; padding:1rem;
  }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog label { display:block; margin:.5rem 0; color:var(--dim); font-size:11px; }
  dialog input, dialog textarea, dialog select {
    display:block; width:22rem; margin-top:.2rem; font:inherit;
    background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:.3rem .4rem;
  }
  dialog textarea { height:5rem; resize:vertical; }
  .dlg-foot { display:flex; gap:.5rem; justify-content:flex-end; margin-top:.8rem; }
</style>
</head>
<body>

<div class="top">
  <span class="brand">Jarvis</span>
  <span class="pill" id="state"><i class="dot"></i> состояние…</span>
  <span class="spacer"></span>
  <button type="button" class="toggle" id="toggle-rail" aria-pressed="true">Прогоны</button>
  <button type="button" class="toggle" id="toggle-side" aria-pressed="true">Артефакты</button>
  <button class="primary" id="start-open">Запустить задачу</button>
  <button type="button" id="stop" disabled>Остановить</button>
</div>

<div class="body">
  <div class="rail" id="rail">
    <div class="label">Прогоны · <span id="rail-count">—</span></div>
    <input id="filter" class="filter" placeholder="фильтр по задаче">
    <div id="tasks"></div>
  </div>
  <div class="main">
    <div class="strip" id="strip"></div>
    <div id="budget"></div>
    <div id="asked"></div>
    <div class="tabs">
      <button type="button" class="tab on" data-view="feed">События</button>
      <button type="button" class="tab" data-view="diff" id="tab-diff">Диф</button>
    </div>
    <div class="feed" id="feed"></div>
    <pre class="diff" id="diff" hidden></pre>
  </div>
  <div class="side" id="side"></div>
</div>

<dialog id="start">
  <form method="dialog" id="start-form">
    <label>Ключ задачи в YouTrack<input name="issueId" placeholder="FM-6347"></label>
    <label>Или текст задачи (без YouTrack)<textarea name="text" placeholder="Что сделать"></textarea></label>
    <label>Модель<input name="model" placeholder="пусто — по умолчанию"></label>
    <label style="display:flex;gap:.4rem;align-items:flex-start">
      <input type="checkbox" name="confirmed" style="width:auto;margin:.2rem 0 0">
      <span>Продолжить с сохранённым разбором
        <span style="display:block;color:var(--faint)">Только для повторного запуска: первый
        останавливается на пересказе «как я понял задачу». Без сохранённого разбора
        прогон остановится впустую.</span>
      </span>
    </label>
    <div class="dlg-foot">
      <button value="cancel">Отмена</button>
      <button class="primary" value="send" id="send">Отправить</button>
    </div>
  </form>
</dialog>

<script>
const STEPS = ['analyze', 'prepare', 'implement', 'check', 'review', 'pr'];
// Флаг `loop` появился 22 августа; у событий старше него опознаём контейнер по
// имени, иначе в ленте он рисуется полным идентификатором в три строки.
const LOOP_ID = 'jarvis-implement-check-review';
const isLoop = (e) => e.loop === true || e.stage === LOOP_ID;
// Полный набор из `DecisionId`/`IncomingId` агента. Раскладка по трём корзинам,
// и незнакомый идентификатор попадает в «непонятно», а не в «хорошо»: дважды
// новое решение (PR3, потом I5) молча красилось зелёным.
const STOP = new Set([
  'A1', 'A2', 'A4', 'P1',
  'I2', 'I4', 'I5',
  'C1', 'C3',
  'R1', 'R3',
  'PR1', 'PR2', 'PR3',
  'M3', 'M4', 'M5',
]);
const GOOD = new Set(['A6', 'I1', 'I3', 'C2', 'R2', 'PR4', 'M1', 'M6']);
// Куда прогон идёт после решения — из самого решения, а не из догадок по истории.
const NEXT = {proceed: 'prepare', checks: 'check', review: 'review', retry: 'implement', publish: 'pr'};
// Эти шаги выполняются один раз, поэтому «зелёный» для них правда. Шаги петли
// завершаются на каждой попытке, и зелёный по факту завершения означал бы, что
// после трёх кругов пройдено всё.
const ONCE = new Set(['analyze', 'prepare']);
// M7 — отмену запросил человек: не поломка и не успех.
const HOLD = new Set(['A3', 'A5', 'C4', 'R4', 'M2', 'M7']);

const events = [];
let runs = [];
let snapshot = {phase: 'unknown'};
let selected = null;
let detail = null;
let railSignature = '';
let askedSignature = '';
let filter = '';
// Пределы на задачу. Замер на 460 прогонах: без предела на PR у задачи с 60
// попытками выходило 15 чипов, а по всему списку — 136 чипов и четыре экрана.
const BARS = 10;
const expanded = new Set();

const el = (id) => document.getElementById(id);
const hhmmss = (iso) => new Date(iso).toTimeString().slice(0, 8);
const secs = (ms) => (ms >= 60000 ? `${Math.round(ms / 60000)} мин` : `${(ms / 1000).toFixed(1)} с`);
const esc = (s) => String(s ?? '').replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

const mine = () => events.filter((e) => e.runTag === selected);

/** Ссылка на PR нужна чаще для вставки, чем для перехода: клик копирует. */
const prLink = (url, text, about) =>
  `<a class="pr" data-copy href="${esc(url)}" target="_blank" rel="noreferrer"
      title="${esc(about ? about + '. ' : '')}клик — скопировать, ⌘/Ctrl+клик — открыть">${esc(text)}</a>`;

document.addEventListener('click', (click) => {
  const link = click.target.closest?.('a[data-copy]');
  if (!link || click.metaKey || click.ctrlKey || click.shiftKey) return;
  click.preventDefault();
  const was = link.textContent;
  navigator.clipboard.writeText(link.href).then(
    () => {
      link.textContent = 'скопировано';
      setTimeout(() => { link.textContent = was; }, 900);
    },
    () => window.open(link.href, '_blank', 'noreferrer'),
  );
});
const tone = (id) =>
  STOP.has(id) ? 'stop' : HOLD.has(id) ? 'hold' : GOOD.has(id) ? 'ok' : 'ms';

/* ---------- события ---------- */

function renderFeed() {
  const rows = mine();
  if (!rows.length) {
    el('feed').innerHTML = '<div class="empty">событий по этому прогону нет</div>';
    return;
  }
  el('feed').innerHTML = rows.map((e) => {
    if (e.decision && e.replyKey !== undefined) {
      return row(e.at, 'входящее', `${e.decision}${e.reason ? ' · ' + e.reason : ''}`, tone(e.decision));
    }
    if (e.decision) {
      const tail = e.reason ? `\n${e.reason}` : '';
      return row(e.at, e.stage, `${e.decision} · ${e.go}${tail}`, tone(e.decision));
    }
    if (e.ms !== undefined) {
      const loop = isLoop(e);
      const what = loop ? `целиком — ${secs(e.ms)}` : `завершён за ${secs(e.ms)}`;
      return row(e.at, loop ? 'попытка' : e.stage, what, 'ms');
    }
    return row(e.at, e.stage ?? '—', JSON.stringify(e), 'ms');
  }).join('');
  el('feed').scrollTop = el('feed').scrollHeight;
}

const row = (at, who, what, cls) =>
  `<div class="row ${cls}"><span class="at">${hhmmss(at)}</span>` +
  `<span class="who">${esc(who)}</span><span class="what">${esc(what)}</span></div>`;

/* ---------- полоса шагов ---------- */

function renderStrip() {
  if (!selected) { el('strip').innerHTML = ''; return; }
  const rows = mine();
  const ran = new Set(
    rows.filter((e) => e.ms !== undefined && !isLoop(e)).map((e) => e.stage),
  );
  const stopped = rows.find((e) => e.decision && STOP.has(e.decision) && e.stage);
  const published = rows.some((e) => e.decision === 'PR4');
  const attempts = rows.filter((e) => typeof e.attempt === 'number').map((e) => e.attempt);
  const attempt = attempts.length ? Math.max(...attempts) : 0;

  // Событий начала шага агент не пишет, зато решение говорит, куда идём дальше.
  const lastGo = [...rows].reverse().find((e) => e.go && NEXT[e.go]);
  const running = snapshot.active?.runTag === selected && !stopped
    ? NEXT[lastGo?.go] ?? (ran.has('analyze') ? undefined : 'analyze')
    : undefined;

  // Где прогон встал, если он уже не идёт и до PR не дошёл: последнее событие и
  // есть точка остановки. Без этого полоса показывала «analyze ✓» и пустоту.
  const lastEvent = rows[rows.length - 1];
  const halted =
    !running && !published && lastEvent?.stage ? lastEvent.stage : undefined;
  // Отмену агент помечает исходом, поэтому шаг, на котором прогон погас, — это
  // пауза по воле человека, а не место поломки.
  const cancelled =
    runs.find((r) => r.runTag === selected)?.outcome?.kind === 'cancelled';
  const haltTone = cancelled || !stopped ? 'hold' : 'stop';

  const times = (stage) =>
    rows.filter((e) => e.ms !== undefined && !isLoop(e) && e.stage === stage).length;

  const chip = (s) => {
    const done = s === 'pr' ? published : ONCE.has(s) && ran.has(s);
    const cls = stopped?.stage === s ? (cancelled ? 'hold' : 'stop')
      : s === running ? 'now'
      : s === halted ? haltTone
      : done ? 'done'
      : ran.has(s) ? 'ran' : '';
    const mark = cls === 'done' ? ' ✓'
      : cls === 'now' ? ' ◉'
      : cls === 'stop' ? ' ✕'
      : cls === 'hold' ? ' ⏸'
      : '';
    // Счётчик вместо легенды: серый с «×3» читается сам — шаг петли прогонялся
    // трижды и, скорее всего, прогонится снова.
    const count = !ONCE.has(s) && s !== 'pr' && times(s) > 1 ? ` ×${times(s)}` : '';
    const why = cls === 'done' ? 'пройден'
      : cls === 'now' ? 'идёт сейчас'
      : cls === 'stop' ? 'здесь прогон остановлен'
      : cls === 'hold' ? (cancelled ? 'здесь прогон отменён человеком' : 'здесь прогон ждёт человека')
      : cls === 'ran' ? `выполнений: ${times(s)}; в петле это не «пройден»`
      : 'не выполнялся';
    return `<span class="step ${cls}" title="${esc(why)}">${s}${mark}${count}</span>`;
  };

  const head = [chip('analyze'), '<span class="arrow">→</span>', chip('prepare'), '<span class="arrow">→</span>'];
  const loop = `<span class="loop"><span style="color:var(--faint);font-size:10px">попытка ${attempt || 1}</span>` +
    [chip('implement'), '<span class="arrow">·</span>', chip('check'), '<span class="arrow">·</span>', chip('review')].join('') +
    '</span>';
  const tail = ['<span class="arrow">→</span>', chip('pr')];

  const last = rows[rows.length - 1];
  const gap = last ? Date.now() - new Date(last.at).getTime() : 0;
  const quiet = running
    ? `<span class="quiet ${gap > 120000 ? 'stale' : ''}">тишина ${gap >= 60000 ? secs(gap) : Math.round(gap / 1000) + ' с'}</span>`
    : '';

  el('strip').innerHTML = [...head, loop, ...tail].join('') + quiet;
  renderBudget();
}

/**
 * Срок прогона. Считается агентом в момент взятия машины, поэтому «сколько идёт»
 * и «сколько осталось» — это его цифры, а не наши догадки по первому событию.
 */
function renderBudget() {
  const active = snapshot.active;
  if (!active || active.runTag !== selected || !active.since || !active.deadlineAt) {
    el('budget').innerHTML = '';
    return;
  }
  const started = new Date(active.since).getTime();
  const total = active.deadlineAt - started;
  const spent = Math.min(Date.now() - started, total);
  const share = total > 0 ? Math.round((spent / total) * 100) : 0;
  const left = Math.max(active.deadlineAt - Date.now(), 0);
  el('budget').innerHTML = `<div class="bar-row">
    <span class="bar-note">идёт ${secs(spent)} · до срока ${secs(left)}</span>
    <span class="bar"><i style="width:${share}%;background:${share > 80 ? 'var(--warn)' : 'var(--ok)'}"></i></span>
  </div>`;
}

/* ---------- список прогонов ---------- */

function renderRail() {
  const byTask = new Map();
  for (const run of runs) {
    const key = run.taskRef || 'без задачи';
    if (!byTask.has(key)) byTask.set(key, []);
    byTask.get(key).push(run);
  }
  const colour = (run) => {
    const kind = run.outcome?.kind;
    if (kind === 'pr') return 'var(--ok)';
    if (kind === 'kept' || kind === 'stopped' || kind === 'failed') return 'var(--bad)';
    // `cancelled` — остановил человек. Ничего не сломалось, красить красным нельзя.
    if (
      kind === 'cancelled' || kind === 'asked' || kind === 'suspended' ||
      kind === 'no-changes' || kind === 'skipped'
    ) {
      return 'var(--warn)';
    }
    return 'var(--faint)';
  };
  // Формат вручную: локальный `toLocaleString` вставляет запятую, и строка с
  // ссылкой на PR перестаёт влезать в 210 px, ломая дату на две линии.
  const when = (run) => {
    const at = run.startedAt ?? run.lastAt;
    if (!at) return '—';
    const d = new Date(at);
    const two = (n) => String(n).padStart(2, '0');
    return `${two(d.getDate())}.${two(d.getMonth() + 1)} ${two(d.getHours())}:${two(d.getMinutes())}`;
  };

  const signature = runs.map((r) => `${r.runTag}:${r.outcome?.kind ?? ''}`).join('|')
    + `#${selected}#${[...expanded].sort().join(',')}#${filter}`;
  if (signature === railSignature) return;
  railSignature = signature;

  const needle = filter.trim().toLowerCase();
  const groups = [...byTask].filter(([task]) => !needle || task.toLowerCase().includes(needle));
  el('rail-count').textContent = needle ? `${groups.length} из ${byTask.size}` : String(groups.length);

  el('tasks').innerHTML = groups.map(([task, list]) => {
    const open = expanded.has(task);
    const shown = open ? list : list.slice(0, BARS);
    const hidden = list.length - shown.length;

    // Свёрнутая задача — только полоски: цвет уже говорит, какие попытки дали PR.
    // Развёрнутая — по строке на прогон, и ссылка стоит в строке своего прогона,
    // а не отдельным рядом чипов: иначе непонятно, какой PR к какому запуску.
    const bars = `<div class="runs">${shown.map((r) =>
      `<button type="button"
          title="${esc(r.runTag)} · ${esc(r.outcome?.kind ?? 'без исхода')}"
          aria-label="прогон ${esc(r.runTag)}, исход ${esc(r.outcome?.kind ?? 'неизвестен')}"
          data-tag="${esc(r.runTag)}"
          class="${r.runTag === selected ? 'sel' : ''}"
          style="background:${colour(r)}"></button>`).join('')}${
      list.length > BARS
        ? `<button type="button" class="more" data-task="${esc(task)}">${open ? 'свернуть' : '+' + hidden}</button>`
        : ''
    }</div>`;

    const rows = list.map((r) => `<div class="run ${r.runTag === selected ? 'sel' : ''}">
      <button type="button" class="pick" data-tag="${esc(r.runTag)}">
        <i class="dot" style="background:${colour(r)}"></i>
        <span class="mono">${esc(r.runTag)}</span>
        <span class="dim when">${esc(when(r))}</span>
        ${r.outcome?.prUrl ? '' : `<span class="dim kind">${esc(r.outcome?.kind ?? '—')}</span>`}
      </button>
      ${r.outcome?.prUrl
        ? prLink(r.outcome.prUrl, '↗ ' + r.outcome.prUrl.split('/').pop(), `PR прогона ${r.runTag}`)
        : ''}
    </div>`).join('');

    return `<div class="task">
      <div class="task-head">
        <button type="button" class="name" data-task="${esc(task)}">${open ? '▾' : '▸'} ${esc(task)}</button>
        <span>${list.length}</span>
      </div>
      ${open ? `<div class="rows">${rows}</div>` : bars}
    </div>`;
  }).join('');

  for (const bar of el('tasks').querySelectorAll('button[data-tag]')) {
    bar.onclick = () => select(bar.dataset.tag);
  }
  for (const toggle of el('tasks').querySelectorAll('button[data-task]')) {
    toggle.onclick = () => {
      const task = toggle.dataset.task;
      expanded.has(task) ? expanded.delete(task) : expanded.add(task);
      renderRail();
    };
  }
}

/* ---------- артефакты выбранного прогона ---------- */

function renderSide() {
  if (!detail) { el('side').innerHTML = '<div class="label">Артефакты</div>'; return; }
  const {run, json, files} = detail;
  const analysis = json['analysis.json'];
  const result = json['result.json'];
  const checks = Object.keys(json).filter((n) => n.startsWith('checks.')).sort().pop();
  const cards = [];

  cards.push(`<div class="card"><h4>${esc(run.runTag)} · ${esc(run.taskRef)}</h4>
    <p>${esc(run.model ?? 'модель не записана')}</p>
    ${run.resumed ? '<p style="color:var(--warn)">прогон продолжался после ответа</p>' : ''}</div>`);

  if (result) {
    const url = result.prUrl;
    cards.push(`<div class="card"><h4>Исход · ${esc(result.kind ?? (url ? 'pr' : '—'))}</h4>
      ${url ? `<p>${prLink(url, '↗ ' + url.split('/').pop(), `PR прогона ${run.runTag}`)}</p>` : ''}
      ${result.reason ? `<p style="color:var(--bad)">${esc(result.reason)}</p>` : ''}
      ${result.branch ? `<p style="color:var(--dim)">${esc(result.branch)}</p>` : ''}</div>`);
  }

  // Старый прогон: структурированного исхода нет, только проза из meta.
  if (!result && run.outcome?.reason) {
    cards.push(`<div class="card"><h4>Исход · записан прозой</h4>
      <p style="color:var(--dim)">${esc(run.outcome.reason)}</p></div>`);
  }

  if (analysis?.summary) {
    cards.push(`<div class="card"><h4>Как понял задачу</h4><p>${esc(analysis.summary)}</p></div>`);
  }
  if (analysis?.plan?.length) {
    cards.push(`<div class="card"><h4>План · ${analysis.plan.length}</h4>
      <ul>${analysis.plan.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>`);
  }
  if (analysis?.questions?.length) {
    cards.push(`<div class="card"><h4>Вопросы · ${analysis.questions.length}</h4>
      <ul>${analysis.questions.map((q) => `<li style="color:var(--warn)">${esc(q)}</li>`).join('')}</ul></div>`);
  }
  if (checks && json[checks]) {
    const c = json[checks];
    const attempt = checks.split('.')[1];
    // Лог проверки — ссылкой: без неё «typecheck ✕» не отвечает на «что именно».
    const chip = (r) => {
      const text = `${r.check} ${r.ok ? '✓' : '✕'} ${secs(r.durationMs ?? 0)}`;
      const name = `checks.${attempt}.${r.check}.log`;
      const colour = r.ok ? 'var(--ok)' : 'var(--bad)';
      return files.includes(name)
        ? `<a href="/api/file?tag=${encodeURIComponent(run.runTag)}&name=${encodeURIComponent(name)}"
              target="_blank" rel="noreferrer" style="color:${colour}"
              title="открыть ${esc(name)}">${esc(text)}</a>`
        : `<span style="color:${colour}">${esc(text)}</span>`;
    };
    cards.push(`<div class="card"><h4>Проверки · попытка ${esc(attempt)}</h4><p>${[
      ...(c.ran ?? []).map(chip),
      ...(c.skipped ?? []).map((s) => `<span style="color:var(--faint)">${esc(s)} — нет</span>`),
    ].join(' · ')}</p>
    ${c.blocked ? `<p style="color:var(--warn)">не смогла отработать: ${esc(c.blocked)}</p>` : ''}</div>`);
  }
  const patch = files.includes('diff.final.patch')
    ? 'diff.final.patch'
    : files.includes('diff.patch')
      ? 'diff.patch'
      : undefined;
  if (patch) {
    cards.push(`<div class="card"><h4>Диф · ${esc(patch)}</h4>
      <p><button type="button" id="show-diff" data-name="${esc(patch)}">Показать</button></p></div>`);
  }

  if (files.length) {
    cards.push(`<div class="card"><h4>Файлы · ${files.length}</h4><div class="files">${
      files.map((f) => `<a href="/api/file?tag=${encodeURIComponent(run.runTag)}&name=${encodeURIComponent(f)}" target="_blank" rel="noreferrer">${esc(f)}</a>`).join('')
    }</div></div>`);
  }
  el('side').innerHTML = '<div class="label" style="padding-left:0">Артефакты</div>' + cards.join('');
  const button = el('show-diff');
  if (button) button.onclick = () => showDiff(run.runTag, button.dataset.name);
  el('tab-diff').disabled = !patch;
}

/** Раскраска по первому символу строки — весь разбор унифицированного дифа. */
function renderDiff(text) {
  const line = (raw) => {
    const cls = raw.startsWith('+++') || raw.startsWith('---') || raw.startsWith('diff --git')
      ? 'file'
      : raw.startsWith('@@') ? 'hunk'
      : raw.startsWith('+') ? 'add'
      : raw.startsWith('-') ? 'del'
      : '';
    return `<div class="${cls}">${esc(raw) || ' '}</div>`;
  };
  el('diff').innerHTML = text.split('\n').map(line).join('');
}

async function showDiff(tag, name) {
  view('diff');
  el('diff').innerHTML = '<div>читаю…</div>';
  try {
    const text = await (await fetch(`/api/file?tag=${encodeURIComponent(tag)}&name=${encodeURIComponent(name)}`)).text();
    renderDiff(text);
  } catch (error) {
    el('diff').innerHTML = `<div class="del">не прочитался: ${esc(String(error))}</div>`;
  }
}

function view(which) {
  el('feed').hidden = which !== 'feed';
  el('diff').hidden = which !== 'diff';
  for (const tab of document.querySelectorAll('.tab')) {
    tab.classList.toggle('on', tab.dataset.view === which);
  }
}

/* ---------- состояние ---------- */

function renderState() {
  const active = snapshot.active;
  const waiting = snapshot.waiting?.length ?? 0;
  el('state').innerHTML = active
    ? `<i class="dot on"></i> работает · <b>${esc(active.taskRef)}</b> · ${esc(active.runTag)}` +
      (waiting ? ` · ждут ответа: ${waiting}` : '')
    : `<i class="dot"></i> свободен` + (waiting ? ` · ждут ответа: ${waiting}` : '');
  el('start-open').disabled = Boolean(active);
  const stop = el('stop');
  stop.disabled = !active;
  stop.title = active
    ? `отменить ${active.taskRef} — работа уйдёт в stash`
    : 'нечего отменять';
}

/* ---------- загрузка ---------- */

async function select(tag) {
  selected = tag;
  el('diff').innerHTML = '';
  view('feed');
  renderRail();
  renderStrip();
  renderFeed();
  detail = null;
  renderSide();
  try {
    detail = await (await fetch(`/api/run?tag=${encodeURIComponent(tag)}`)).json();
  } catch {
    detail = null;
  }
  renderSide();
}

async function loadRuns() {
  const data = await (await fetch('/api/runs')).json();
  runs = data.runs ?? [];
  renderRail();
  if (!selected && runs.length) select(runs[0].runTag);
}

/**
 * Вопросы к человеку. Прогон припаркован под меткой задачи, ответ уезжает вторым
 * A2A-запросом с `metadata.answer`. Ожидание с тредом отвечается в Mattermost —
 * перехватывать его панелью незачем.
 */
async function renderAsked() {
  const waiting = snapshot.waiting ?? [];
  if (!waiting.length) { el('asked').innerHTML = ''; return; }

  const blocks = await Promise.all(waiting.map(async (item) => {
    let questions = [];
    try {
      const info = await (await fetch(`/api/run?tag=${encodeURIComponent(item.runTag)}`)).json();
      questions = info.json?.['analysis.json']?.questions
        ?? info.json?.['meta.json']?.ended?.questions
        ?? [];
    } catch {
      questions = [];
    }
    const inThread = Boolean(item.thread);
    return `<div class="asked">
      <h3>Ждёт ответа · ${esc(item.taskRef)} · ${esc(item.runTag)}</h3>
      ${questions.length
        ? `<ol>${questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ol>`
        : '<p class="hint">текст вопросов не найден в артефактах прогона</p>'}
      ${inThread
        ? `<div class="foot">
             <span class="hint">ответ идёт в тред Mattermost — панель в него не пишет</span>
             <button type="button" data-drop="${esc(item.taskRef)}">Снять с ожидания</button>
           </div>`
        : `<textarea data-answer="${esc(item.taskRef)}" placeholder="Ответ — фактами, по пунктам"></textarea>
           <div class="foot">
             <button type="button" class="primary" data-send="${esc(item.taskRef)}">Ответить</button>
             <button type="button" data-drop="${esc(item.taskRef)}">Снять с ожидания</button>
             <span class="hint" data-note="${esc(item.taskRef)}"></span>
           </div>`}
    </div>`;
  }));

  el('asked').innerHTML = blocks.join('');
  for (const button of el('asked').querySelectorAll('button[data-send]')) {
    button.onclick = () => sendAnswer(button.dataset.send, button);
  }
  for (const button of el('asked').querySelectorAll('button[data-drop]')) {
    button.onclick = () => cancel(button.dataset.drop, `Снять ${button.dataset.drop} с ожидания?`);
  }
}

/** Работа не теряется: агент кладёт её в stash и говорит об этом в ответе. */
async function cancel(taskRef, question) {
  if (!confirm(question)) return;
  try {
    const reply = await (await fetch('/api/cancel', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({taskRef}),
    })).json();
    if (reply.note) alert(reply.note);
    loadState();
  } catch (error) {
    alert(String(error));
  }
}

async function sendAnswer(taskRef, button) {
  const box = el('asked').querySelector(`textarea[data-answer="${taskRef}"]`);
  const note = el('asked').querySelector(`span[data-note="${taskRef}"]`);
  const answer = box?.value.trim();
  if (!answer) { note.textContent = 'ответ пустой'; return; }
  button.disabled = true;
  note.textContent = 'отправляю…';
  try {
    const reply = await (await fetch('/api/answer', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({taskRef, answer}),
    })).json();
    note.textContent = reply.sent ? 'принято, прогон продолжается' : (reply.note ?? 'не принято');
    if (reply.sent) box.value = '';
  } catch (error) {
    note.textContent = String(error);
  } finally {
    button.disabled = false;
  }
}

async function loadState() {
  try {
    snapshot = await (await fetch('/api/state')).json();
  } catch {
    snapshot = {phase: 'unknown'};
  }
  renderState();
  renderStrip();
  // Перерисовка стирала бы набранный ответ, поэтому только при смене состава.
  const waitingNow = (snapshot.waiting ?? []).map((w) => w.runTag).sort().join(',');
  if (waitingNow !== askedSignature) {
    askedSignature = waitingNow;
    renderAsked();
  }
}

const stream = new EventSource('/api/events');
stream.onmessage = (message) => {
  try {
    const event = JSON.parse(message.data);
    events.push(event);
    if (!selected) select(event.runTag);
    if (event.runTag === selected) { renderFeed(); renderStrip(); }
  } catch {
    // Строка не разобралась — журнал мог дописываться в момент чтения.
  }
};

/** Свернутость панелей переживает перезагрузку: это настройка рабочего места. */
function setupToggle(id, panel, key) {
  const button = el(id);
  const apply = (off) => {
    el(panel).classList.toggle('off', off);
    button.classList.toggle('off', off);
    button.setAttribute('aria-pressed', String(!off));
  };
  apply(localStorage.getItem(key) === 'off');
  button.onclick = () => {
    const off = !el(panel).classList.contains('off');
    localStorage.setItem(key, off ? 'off' : 'on');
    apply(off);
  };
}
el('filter').oninput = () => { filter = el('filter').value; renderRail(); };

for (const tab of document.querySelectorAll('.tab')) {
  tab.onclick = () => {
    if (tab.dataset.view === 'diff' && !el('diff').innerHTML) {
      const button = el('show-diff');
      if (button) return showDiff(selected, button.dataset.name);
    }
    view(tab.dataset.view);
  };
}

el('stop').onclick = () => {
  const active = snapshot.active;
  if (!active) return;
  cancel(active.taskRef, `Отменить ${active.taskRef}? Работа уйдёт в stash.`);
};

setupToggle('toggle-rail', 'rail', 'panel.rail');
setupToggle('toggle-side', 'side', 'panel.side');

el('start-open').onclick = () => el('start').showModal();
el('start-form').onsubmit = async (submit) => {
  if (submit.submitter?.value !== 'send') return;
  const form = new FormData(el('start-form'));
  const body = {
    issueId: (form.get('issueId') || '').trim() || undefined,
    text: (form.get('text') || '').trim(),
    model: (form.get('model') || '').trim() || undefined,
    confirmed: form.get('confirmed') === 'on',
  };
  try {
    const answer = await (await fetch('/api/start', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify(body),
    })).json();
    if (!answer.sent) alert(`не отправилось: ${answer.note ?? 'причина неизвестна'}`);
  } catch (error) {
    alert(`не отправилось: ${error}`);
  }
};

loadRuns();
loadState();
setInterval(loadState, 2000);
setInterval(loadRuns, 15000);
setInterval(renderStrip, 1000);
</script>
</body>
</html>
